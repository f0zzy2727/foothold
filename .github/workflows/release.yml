# When a tag such as v0.6.0 is pushed: run the tests, build the upload file
# and attach it to a GitHub release, so people without the marketplace
# address can download it.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test and package
        run: sh scripts/package.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/job-search.plugin --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed."
